[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["ai-healthcare-intel-engine"]
markers = [
    "ml: optional local sentence-transformer tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    ".venv312",
    "venv",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
