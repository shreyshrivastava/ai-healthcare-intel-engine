name: CI

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CI: "1"
      HEALTHCARE_EMBEDDING_BACKEND: keyword
      HEALTHCARE_FRONTEND_MODE: local
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            ai-healthcare-intel-engine/requirements.txt
            ai-healthcare-intel-engine/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Compile Python files
        run: python -m compileall ai-healthcare-intel-engine tests evaluation benchmarks

      - name: Run tests
        run: pytest

      - name: Run evaluation
        run: python evaluation/run_evaluation.py

      - name: Run model comparison smoke
        run: python evaluation/run_model_comparison.py

      - name: Run benchmark smoke
        run: python benchmarks/run_benchmarks.py 1

      - name: Validate Docker builds
        run: |
          docker build -f Dockerfile -t healthcare-intel-streamlit:ci .
          docker build -f Dockerfile.api -t healthcare-intel-api:ci .
